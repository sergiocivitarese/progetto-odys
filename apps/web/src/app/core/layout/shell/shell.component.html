<a class="skip-link" href="#main">Vai al contenuto</a>

<header class="topbar">
  <div class="topbar__inner">
    <a routerLink="/" class="brand" aria-label="Odys, torna a Esplora">
      <odys-logo [size]="28" />
    </a>

    <nav class="topnav" aria-label="Navigazione principale">
      @for (item of nav().items; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!item.exact }" class="topnav__link" [class.topnav__link--primary]="item.primary">
          {{ item.label }}
        </a>
      }
      <a routerLink="/esplora" routerLinkActive="is-active" class="topnav__link">Dai coordinatori</a>
    </nav>

    <div class="topbar__actions">
      <odys-theme-switch />
      <button type="button" class="icon-button" (click)="onboarding.reopen()" aria-label="Come funziona Odys">
        <odys-icon name="info" [size]="20" />
      </button>
      <odys-user-menu />
    </div>
  </div>
</header>

<main id="main" class="main">
  <router-outlet />
</main>

<nav class="tabbar" [class.tabbar--agency]="nav().tone === 'agency'" aria-label="Navigazione principale">
  @for (item of nav().items; track item.path) {
    <a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!item.exact }"
       class="tabbar__link" [class.tabbar__link--primary]="item.primary" [attr.aria-label]="item.label">
      <odys-icon [name]="item.icon" [size]="item.primary ? 24 : 22" />
      <span class="tabbar__label" aria-hidden="true">{{ short(item) }}</span>
    </a>
  }
</nav>

<odys-onboarding-dialog [open]="onboarding.visible()" (completed)="onOnboarding($event)" />
